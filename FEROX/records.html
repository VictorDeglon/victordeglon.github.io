<!doctype html>
<html lang="en" data-state="pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<meta name="description" content="FEROX now lives at feroxfitness.web.app.">
<title>FEROX has moved</title>
<link rel="icon" href="mascot-128.png" type="image/png">
<!--
  FEROX has moved to https://feroxfitness.web.app. This page (and every copy
  of it in this folder, one per page name the app used to have) only hands a
  visitor over — bridge.js decides what to show. No app code, no analytics,
  no external requests. No front matter on purpose: Jekyll copies the file
  verbatim, so the site's head-custom include never reaches it.
-->
<style>
:root {
  --bg: #09090B;
  --card: #131316;
  --surf-2: #1A1A1E;
  --control: #232328;
  --control-hover: #2D2D33;
  --line: #25252B;
  --line-hi: #36363E;
  --text: #F4F4F6;
  --text-2: #A6A6B0;
  --text-3: #85858F;
  --ember: #FF3D2E;
  --ember-hi: #FF8A3D;
  --ember-btn: #D93427;
  --ember-ink: #FF8A3D;
  --on-ember: #FFFFFF;
  --ok-ink: #2FD99B;
  --bad-ink: #FF7B80;
  --glint: rgb(255 255 255 / .055);
  --lift: 0 1px 2px rgb(0 0 0 / .45);
  --shadow: 0 32px 80px -24px rgb(0 0 0 / .85);
  --wash: 1;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F5F5F7; --card: #FFFFFF; --surf-2: #F6F6F8; --control: #FFFFFF; --control-hover: #F6F6F8;
    --line: #E4E4E9; --line-hi: #D4D4DC; --text: #0B0B0F; --text-2: #4A4A55; --text-3: #686873;
    --ember-btn: #D63327; --ember-ink: #C0261B; --ok-ink: #06704F; --bad-ink: #BE2230;
    --glint: rgb(255 255 255 / 0); --lift: 0 1px 2px rgb(16 16 24 / .06), 0 1px 1px rgb(16 16 24 / .03);
    --shadow: 0 28px 64px -22px rgb(16 16 24 / .26), 0 4px 12px -4px rgb(16 16 24 / .08);
    --wash: 0; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F5F5F7; --card: #FFFFFF; --surf-2: #F6F6F8; --control: #FFFFFF; --control-hover: #F6F6F8;
  --line: #E4E4E9; --line-hi: #D4D4DC; --text: #0B0B0F; --text-2: #4A4A55; --text-3: #686873;
  --ember-btn: #D63327; --ember-ink: #C0261B; --ok-ink: #06704F; --bad-ink: #BE2230;
  --glint: rgb(255 255 255 / 0); --lift: 0 1px 2px rgb(16 16 24 / .06), 0 1px 1px rgb(16 16 24 / .03);
  --shadow: 0 28px 64px -22px rgb(16 16 24 / .26), 0 4px 12px -4px rgb(16 16 24 / .08);
  --wash: 0; color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  display: grid; place-items: center;
  padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
           max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background-color: var(--bg);
  background-image: radial-gradient(60rem 28rem at 50% -10%, rgb(255 61 46 / calc(.13 * var(--wash))), transparent 70%);
  color: var(--text);
  font: 400 1rem/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
}

.card {
  width: min(100%, 460px);
  padding: clamp(24px, 6vw, 38px);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 26px;
  box-shadow: inset 0 1px 0 var(--glint), var(--shadow);
  animation: rise .52s var(--ease) both;
}
/* Nothing shows until bridge.js has decided — most visitors are sent straight
   on. If the script never runs, the plain "has moved" card appears anyway. */
[data-state="pending"] .card, [data-state="redirect"] .card {
  visibility: hidden;
  animation: reveal 0s 3s forwards;
}
@keyframes reveal { to { visibility: visible; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

.brand { display: flex; align-items: center; gap: 12px; margin: 0 0 22px; }
.brand img { display: block; width: 48px; height: 48px; flex: none; }
.brand span { font-weight: 900; font-size: .84rem; letter-spacing: .16em; }

h1 {
  margin: 0 0 10px;
  font-size: clamp(1.85rem, 1.45rem + 2vw, 2.4rem); font-weight: 800;
  line-height: 1.06; letter-spacing: -.028em;
}
.lead { margin: 0; color: var(--text-2); font-size: 1.04rem; }
.addr { color: var(--text); font-weight: 650; white-space: nowrap; }

.status { margin: 22px 0 0; }
.status:empty { display: none; }
.status p { margin: 0 0 8px; color: var(--text-2); }
.status p:last-child { margin-bottom: 0; }
.status .headline { color: var(--text); font-weight: 600; }
.status[data-tone="ok"] .headline { color: var(--ok-ink); }
.status[data-tone="bad"] .headline { color: var(--bad-ink); }
.status strong { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }

.spin {
  display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px;
  border: 2px solid var(--line-hi); border-top-color: var(--ember); border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.actions { display: grid; gap: 10px; margin-top: 24px; }
.actions:empty { display: none; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 50px; padding: 13px 22px;
  border: 1px solid var(--line-hi); border-radius: 14px;
  background: var(--control); color: var(--text);
  box-shadow: inset 0 1px 0 var(--glint), var(--lift);
  font: 600 .97rem/1.2 var(--font); letter-spacing: -.005em;
  text-decoration: none; cursor: pointer;
  transition: background-color .2s var(--ease), box-shadow .2s var(--ease), filter .12s;
}
.btn-primary {
  border-color: transparent;
  background: var(--ember-btn);
  background: linear-gradient(180deg, color-mix(in srgb, var(--ember-btn) 90%, #fff), var(--ember-btn) 50%, color-mix(in srgb, var(--ember-btn) 92%, #000));
  color: var(--on-ember);
  text-shadow: 0 1px 1px rgb(0 0 0 / .18);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .28), 0 1px 2px rgb(0 0 0 / .3), 0 10px 26px -12px rgb(255 61 46 / .55);
}
@media (hover: hover) {
  .btn:hover:not(:disabled) { background-color: var(--control-hover); }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.06) saturate(1.05); }
}
.btn:active:not(:disabled) { filter: brightness(.94); }
.btn:disabled { opacity: .55; cursor: default; }
.btn:focus-visible, .quiet:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }

.quiet {
  justify-self: center; margin-top: 4px; padding: 6px 4px;
  color: var(--text-2); font-size: .9rem; text-decoration: underline;
  text-decoration-color: var(--line-hi); text-underline-offset: 3px; border-radius: 6px;
}
@media (hover: hover) { .quiet:hover { color: var(--text); text-decoration-color: currentColor; } }

.note {
  margin: 22px 0 0; padding-top: 16px; border-top: 1px solid var(--line);
  color: var(--text-3); font-size: .86rem; line-height: 1.5;
}
.note:empty { display: none; }
.note strong { color: var(--text-2); font-weight: 600; }
.note .file { color: var(--text); font-weight: 600; word-break: break-all; }

@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
  [data-state="pending"] .card, [data-state="redirect"] .card { animation: reveal 0s 3s forwards; }
  .spin { animation: none; border-color: var(--ember); }
  .btn { transition: none; }
}
</style>
<noscript><style>[data-state] .card { visibility: visible; animation: none; }</style></noscript>
<script type="module" src="bridge.js"></script>
</head>
<body>
<main class="card" aria-labelledby="title">
  <div class="brand"><img src="mascot-128.png" width="48" height="48" alt=""><span>FEROX</span></div>
  <h1 id="title">FEROX has moved</h1>
  <p class="lead">It lives at <span class="addr">feroxfitness.web.app</span> now.</p>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="actions" id="actions"><a class="btn btn-primary" id="go" href="https://feroxfitness.web.app/">Go to FEROX</a></div>
  <p class="note" id="note"></p>
</main>
</body>
</html>
